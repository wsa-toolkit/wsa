name: build

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile
        run: python3 -m py_compile wsa.py

      - name: AST parse
        run: python3 -c "import ast; ast.parse(open('wsa.py').read())"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y groff-base dpkg-dev debhelper

      - name: Man page renders
        run: groff -man -Tutf8 man/wsa.1 > /dev/null

      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b
